<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Rush – Free Typing Game | TypeMaster Pro</title>

<meta name="description" content="Play Word Rush, a free typing game by TypeMaster Pro. Test your typing speed, accuracy and score in 60 seconds.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    font-size:30px;
    font-weight:800;
}

.logo span{
    color:#38bdf8;
}

.subtitle{
    color:#cbd5e1;
    margin-top:8px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:15px;
    text-align:center;
}

.stat-label{
    font-size:12px;
    color:#94a3b8;
    margin-bottom:6px;
}

.stat-value{
    font-size:25px;
    font-weight:bold;
}

.game-box{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:25px;
}

.timer{
    text-align:center;
    margin-bottom:20px;
}

.timer-value{
    font-size:45px;
    font-weight:bold;
}

.timer-label{
    color:#94a3b8;
}

.word-area{
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
    padding:20px;
    background:rgba(0,0,0,.18);
    border-radius:18px;
}

.word{
    font-size:42px;
    font-weight:bold;
    letter-spacing:2px;
}

.input-box{
    width:100%;
    padding:17px;
    border:none;
    outline:none;
    border-radius:12px;
    font-size:20px;
    text-align:center;
    background:#f8fafc;
    color:#0f172a;
}

.input-box:disabled{
    opacity:.6;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:15px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.start-btn{
    background:#38bdf8;
    color:#082f49;
}

.restart-btn{
    background:#475569;
    color:white;
}

.result{
    display:none;
    margin-top:20px;
    padding:22px;
    border-radius:16px;
    background:rgba(56,189,248,.1);
    text-align:center;
}

.result h2{
    margin-bottom:15px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.result-item{
    padding:14px;
    background:rgba(255,255,255,.07);
    border-radius:12px;
}

.result-number{
    font-size:25px;
    font-weight:bold;
}

.result-label{
    color:#94a3b8;
    font-size:12px;
    margin-top:5px;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#cbd5e1;
}

.back{
    display:block;
    text-align:center;
    color:#7dd3fc;
    text-decoration:none;
    margin-top:20px;
}

@media(max-width:650px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .word{
        font-size:32px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }

    .game-box{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">
            Type<span>Master</span> Pro
        </div>

        <div class="subtitle">
            🎯 Word Rush – Type as many words as you can!
        </div>
    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-label">TIME</div>
            <div class="stat-value" id="time">60</div>
        </div>

        <div class="stat">
            <div class="stat-label">SCORE</div>
            <div class="stat-value" id="score">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">WPM</div>
            <div class="stat-value" id="wpm">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">ACCURACY</div>
            <div class="stat-value" id="accuracy">100%</div>
        </div>

    </div>


    <div class="game-box">

        <div class="timer">
            <div class="timer-value" id="timerDisplay">60</div>
            <div class="timer-label">seconds remaining</div>
        </div>


        <div class="word-area">

            <div class="word" id="word">
                Press Start
            </div>

        </div>


        <input
            type="text"
            id="typingInput"
            class="input-box"
            placeholder="Type the word here..."
            autocomplete="off"
            disabled
        >


        <div class="buttons">

            <button
                class="start-btn"
                id="startBtn"
                onclick="startGame()">
                ▶ Start Game
            </button>

            <button
                class="restart-btn"
                onclick="restartGame()">
                🔄 Restart
            </button>

        </div>


        <div class="message" id="message">
            You have 60 seconds. Type as many correct words as possible.
        </div>


        <div class="result" id="result">

            <h2>🏆 Game Over!</h2>

            <div class="result-grid">

                <div class="result-item">
                    <div class="result-number" id="finalScore">0</div>
                    <div class="result-label">SCORE</div>
                </div>

                <div class="result-item">
                    <div class="result-number" id="finalWpm">0</div>
                    <div class="result-label">WPM</div>
                </div>

                <div class="result-item">
                    <div class="result-number" id="finalAccuracy">0%</div>
                    <div class="result-label">ACCURACY</div>
                </div>

            </div>

            <br>

            <div id="bestMessage"></div>

        </div>

    </div>


    <a class="back" href="games.html">
        ← Back to Games
    </a>

    <a class="back" href="index.html">
        🏠 Back to Typing Test
    </a>

</div>


<script>

const words = [

"apple",
"orange",
"banana",
"computer",
"keyboard",
"mouse",
"screen",
"window",
"school",
"student",
"teacher",
"typing",
"practice",
"learning",
"future",
"success",
"speed",
"accuracy",
"challenge",
"master",
"online",
"website",
"internet",
"program",
"coding",
"javascript",
"browser",
"information",
"office",
"company",
"worker",
"manager",
"project",
"system",
"technology",
"business",
"people",
"country",
"world",
"simple",
"better",
"strong",
"power",
"quick",
"smart",
"happy",
"great",
"today",
"morning",
"evening",
"friend",
"family",
"house",
"water",
"music",
"game",
"player",
"score",
"level",
"target",
"result",
"answer",
"question",
"language",
"english",
"india",
"gujarat",
"typingmaster",
"keyboard",
"lesson",
"exercise",
"correct",
"focus",
"finger",
"letter",
"number",
"word",
"sentence"

];


let currentWord = "";

let timeLeft = 60;

let score = 0;

let correctWords = 0;

let totalAttempts = 0;

let totalTypedCharacters = 0;

let gameRunning = false;

let timerInterval;


const timeElement = document.getElementById("time");

const timerDisplay = document.getElementById("timerDisplay");

const scoreElement = document.getElementById("score");

const wpmElement = document.getElementById("wpm");

const accuracyElement = document.getElementById("accuracy");

const wordElement = document.getElementById("word");

const inputElement = document.getElementById("typingInput");

const startButton = document.getElementById("startBtn");

const messageElement = document.getElementById("message");

const resultElement = document.getElementById("result");


function randomWord(){

    const index = Math.floor(Math.random() * words.length);

    return words[index];

}


function showNextWord(){

    currentWord = randomWord();

    wordElement.textContent = currentWord;

    inputElement.value = "";

}


function startGame(){

    if(gameRunning) return;

    gameRunning = true;

    timeLeft = 60;

    score = 0;

    correctWords = 0;

    totalAttempts = 0;

    totalTypedCharacters = 0;

    resultElement.style.display = "none";

    inputElement.disabled = false;

    inputElement.focus();

    startButton.disabled = true;

    startButton.textContent = "🎮 Game Running";

    scoreElement.textContent = "0";

    wpmElement.textContent = "0";

    accuracyElement.textContent = "100%";

    timeElement.textContent = "60";

    timerDisplay.textContent = "60";

    messageElement.textContent =
        "Go! Type the words as quickly and accurately as possible.";

    showNextWord();


    timerInterval = setInterval(function(){

        timeLeft--;

        timeElement.textContent = timeLeft;

        timerDisplay.textContent = timeLeft;


        updateWPM();


        if(timeLeft <= 0){

            endGame();

        }

    },1000);

}


inputElement.addEventListener("keydown", function(event){

    if(!gameRunning) return;


    if(event.key === "Enter"){

        event.preventDefault();

        checkWord();

    }

});


function checkWord(){

    const typed = inputElement.value.trim();

    if(typed === "") return;


    totalAttempts++;

    totalTypedCharacters += typed.length;


    if(typed.toLowerCase() === currentWord.toLowerCase()){

        correctWords++;

        score += 10;

        messageElement.textContent = "✅ Correct!";

    }

    else{

        messageElement.textContent =
            "❌ Wrong word! Next one...";

    }


    scoreElement.textContent = score;

    updateAccuracy();

    showNextWord();

}


function updateAccuracy(){

    if(totalAttempts === 0){

        accuracyElement.textContent = "100%";

        return;

    }


    const accuracy =
        Math.round((correctWords / totalAttempts) * 100);


    accuracyElement.textContent = accuracy + "%";

}


function updateWPM(){

    const elapsedSeconds = 60 - timeLeft;

    if(elapsedSeconds <= 0){

        wpmElement.textContent = "0";

        return;

    }


    const minutes = elapsedSeconds / 60;

    const wpm = Math.round(correctWords / minutes);

    wpmElement.textContent = wpm;

}


function endGame(){

    clearInterval(timerInterval);

    gameRunning = false;

    inputElement.disabled = true;

    startButton.disabled = false;

    startButton.textContent = "▶ Start Game";

    wordElement.textContent = "GAME OVER";

    messageElement.textContent =
        "Great job! Try again and beat your high score.";

    updateAccuracy();

    updateWPM();


    const finalWPM = parseInt(wpmElement.textContent) || 0;

    const finalAccuracy = accuracyElement.textContent;


    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("finalWpm").textContent =
        finalWPM;

    document.getElementById("finalAccuracy").textContent =
        finalAccuracy;


    let bestScore =
        parseInt(localStorage.getItem("tm_word_rush_best") || "0");


    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "tm_word_rush_best",
            bestScore
        );

        document.getElementById("bestMessage").textContent =
            "🎉 NEW HIGH SCORE: " + bestScore;

    }

    else{

        document.getElementById("bestMessage").textContent =
            "🏆 Best Score: " + bestScore;

    }


    resultElement.style.display = "block";


    /* Save general game achievement */

    localStorage.setItem(
        "tm_game_played",
        "true"
    );

}


function restartGame(){

    clearInterval(timerInterval);

    gameRunning = false;

    timeLeft = 60;

    score = 0;

    correctWords = 0;

    totalAttempts = 0;

    totalTypedCharacters = 0;


    inputElement.disabled = true;

    inputElement.value = "";

    startButton.disabled = false;

    startButton.textContent = "▶ Start Game";

    timeElement.textContent = "60";

    timerDisplay.textContent = "60";

    scoreElement.textContent = "0";

    wpmElement.textContent = "0";

    accuracyElement.textContent = "100%";

    wordElement.textContent = "Press Start";

    messageElement.textContent =
        "You have 60 seconds. Type as many correct words as possible.";

    resultElement.style.display = "none";

}

</script>

</body>
  </html>
